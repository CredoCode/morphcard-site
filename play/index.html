<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MorphCard</title>
<meta name="description" content="MorphCard: a 1v1 card battler in shifting caves. Deal pawn heads, give them bodies, and march to the far row.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#08080b}
sc-for,sc-if,dc-import{display:contents}
*{box-sizing:border-box}
.app{min-height:100vh;background:#08080b;color:#f4efe6;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.45}
.app h1,.app h2,.app h3{font-family:'Cormorant Garamond','Hanken Grotesk',sans-serif;margin:0;letter-spacing:-.015em;line-height:1.08}
.app p{margin:0}
.app button{font:inherit;color:inherit;cursor:pointer}
.app button:disabled{cursor:not-allowed}
.app :focus-visible{outline:3px solid #ffd35a;outline-offset:2px}
.muted{color:#9b9484}
.btn{min-height:44px;padding:10px 20px;border-radius:10px;border:2px solid transparent;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:#c8a96a;color:#14110a}
.btn-p:hover:not(:disabled){background:#dcc088}
.btn-g{background:transparent;border-color:#3d382c;color:#f4efe6}
.btn-g:hover:not(:disabled){border-color:#8a7f66}
.btn-s{background:#17171d;border-color:#3d382c;color:#f4efe6}
.btn-s:hover:not(:disabled){border-color:#8a7f66}
.btn:disabled{opacity:.55}
.btn-p:disabled{background:#3a3322;color:#9b9484}
.wide{width:100%}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:#e3b341;box-shadow:inset 0 0 0 3px #b8861b,inset 0 0 0 5px #f6d77a;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{width:28px;height:38px;border-radius:6px;background:#f4ecdc;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 0 0 2px #c8a96a}
.brand svg{width:20px;height:20px}

/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login-art{flex:1 1 460px;padding:56px 56px 40px;display:flex;flex-direction:column;gap:32px;justify-content:center;background:#0b0b0f;border-right:1px solid #2b2820}
.login-art h1{font-size:clamp(40px,5.2vw,68px);font-weight:800;max-width:11ch}
.login-art p.lede{max-width:44ch;color:#cfc7b4;font-size:18px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,300px);border:8px solid #3a2a1c;border-radius:6px}
.mini .ms{aspect-ratio:1;position:relative;display:grid;place-items:center}
.mini .ms svg{width:82%;height:82%}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;border:2px solid #c8a96a}
.chip.t{border-color:#5aa79c}
.login-form{flex:1 1 400px;display:grid;place-items:center;padding:40px 24px}
.lf{width:min(100%,400px);display:flex;flex-direction:column;gap:14px}
.lf h2{font-size:34px;font-weight:800}
.lf label{font-weight:600;font-size:14px;color:#cfc7b4}
.lf input{min-height:48px;border-radius:10px;border:2px solid #3d382c;background:#0f0f14;color:#f4efe6;padding:0 14px;font:inherit}
.lf input:focus-visible{border-color:#ffd35a;outline:none}
.seg{display:flex;background:#0f0f14;border-radius:12px;padding:4px;border:1px solid #2b2820}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;color:#9b9484}
.seg button.on{background:#f4ecdc;color:#1d1a1f}
.err{color:#ff9a86;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:#9b9484;font-size:14px}
.or:before,.or:after{content:'';flex:1;height:1px;background:#2b2820}
.fine{font-size:13px;color:#9b9484}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:12px 28px;border-bottom:1px solid #2b2820;background:#0c0c10}
.nav{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
.tab{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:transparent;font-weight:700;color:#9b9484}
.tab:hover{color:#f4efe6}
.tab.on{background:#17171d;color:#f4efe6}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:#14141a;border:1px solid #3a352a;font-weight:700}
.pill.ok{border-color:#5aa79c}
.pill.bad{border-color:#c8a96a}
.plus{background:#e3b341;color:#1d1608;border:0;border-radius:999px;min-height:40px;padding:0 16px;font-weight:800}
.plus:hover{background:#f0c75f}
.user{color:#cfc7b4;font-weight:600}

/* lobby */
.wrap{max-width:1240px;margin:0 auto;padding:36px 28px 56px;display:flex;flex-direction:column;gap:32px}
.hero{display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.hero-l{flex:1 1 420px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#dcc088}
.hero h1{font-size:clamp(40px,5vw,70px);font-weight:800}
.hero p.lede{font-size:18px;color:#cfc7b4;max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fan{flex:1 1 360px;display:flex;justify-content:center;align-items:center;min-height:320px}
.fan .card{transform-origin:50% 90%;margin:0 -12px}
.fan .card:nth-child(1){transform:rotate(-9deg) translateY(10px)}
.fan .card:nth-child(2){transform:rotate(0deg) translateY(-8px)}
.fan .card:nth-child(3){transform:rotate(9deg) translateY(10px)}
.tiles3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.qt{background:#0f0f14;border:1px solid #2b2820;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qk{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9b9484}
.qv{font-family:'Cormorant Garamond',sans-serif;font-size:32px;font-weight:800;display:flex;align-items:center;gap:10px;line-height:1.1}
.qt .btn{margin-top:12px}
.sech{font-size:22px;margin-bottom:14px}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.how li{display:flex;gap:12px;color:#cfc7b4;font-size:15px;align-items:flex-start}
.how li:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#17171d;color:#dcc088;font-weight:800;display:grid;place-items:center}
.discard-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.dz{flex:1 1 220px;min-height:48px;border:2px dashed #3d382c;border-radius:12px;display:grid;place-items:center;color:#9b9484;font-weight:600;padding:8px;text-align:center}
.dz.on{border-color:#ffd35a;color:#f4efe6}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.step{background:#0f0f14;border:1px solid #2b2820;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px}
.step h3{font-size:22px}
.step .n{font-weight:800;color:#dcc088;font-family:'Cormorant Garamond',sans-serif}
.step p{color:#cfc7b4}
.ad{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px dashed #4d4736;border-radius:12px;padding:12px 16px;background:#0d0d12}
.ad .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid #4d4736;border-radius:6px;padding:2px 8px;color:#9b9484}
.ad .body{flex:1 1 200px;display:flex;flex-direction:column}
.ad.box{flex-direction:column;align-items:flex-start;min-height:220px;justify-content:center}

/* cards */
.card{width:106px;border-radius:12px;background:#f6efe0;color:#1d1a1f;border:0;padding:0;display:flex;flex-direction:column;overflow:hidden;text-align:center;position:relative;box-shadow:0 0 0 2px #1d1a1f,0 8px 18px rgba(0,0,0,.4);font:inherit}
.card .hd{display:block;background:#8f2f3b;padding:6px 4px 5px;font-family:'Cormorant Garamond',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.04em;color:#1d1208}
.card.body .hd{background:#e3b341}
.card.chk .hd{background:#5aa79c}
/* one-use stamp: the same tag on every one-use card, wherever the card appears */
/* one-use stamp: a vertical tag in the art box's right margin, clear of the title, on every one-use card */
.card .art{position:relative}
.card .once{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:3px;height:12px;padding:0 5px 0 1px;border-radius:6px;background:#1d1a1f;color:#e8cf93;border:1px solid #c8a96a;font:700 7.5px/1 'Hanken Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.card .once b{display:grid;place-items:center;width:10px;height:10px;border-radius:50%;background:#c8a96a;color:#1d1a1f;font-size:7px;letter-spacing:0;font-variant-numeric:lining-nums}
/* make room for the tag between the title and the diagram without squeezing the card text */
.card.oneuse .art{padding-top:17px;padding-bottom:3px}
.card.oneuse small{line-height:1.17;padding-bottom:5px}
.card .art{display:grid;place-items:center;padding:9px 0 7px}
.card small{display:block;padding:0 7px 10px;font-size:11.5px;line-height:1.25;color:#4b4455;font-weight:600}
.card.lg{width:150px}
.card.lg .hd{font-size:16px;padding:8px 4px}
.card.lg .dg{width:112px}
.card.lg small{font-size:13px}
.dg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);width:84px;gap:1px;background:#b9a98a;border-radius:3px;overflow:hidden;box-shadow:0 0 0 2px #1d1a1f}
.dg i{aspect-ratio:1;display:block;position:relative}
.dg i.a{background:#e8ddc6}
.dg i.b{background:#dfd2b8}
.dg i.wl{background:#16151a}
.dg i.mv:after{content:'';position:absolute;inset:26%;border-radius:50%;background:#e8452c;box-shadow:0 0 0 1.5px #fff}
.dg i.ck:after{content:'';position:absolute;inset:14%;border-radius:50%;background:rgba(63,196,178,.75);border:2px solid #0e5f53}
.dg .dgp{position:absolute;left:35%;top:35%;width:30%;aspect-ratio:1;height:auto}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:6px}
.hand .card.dim{opacity:.55}
.rock{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.035) 6px 7px);pointer-events:none}
.sq.wallc{cursor:default}
.hand .card{width:100%}
.hand .card[draggable="true"]{cursor:grab}
.hand .card[draggable="true"]:active{cursor:grabbing}
.hand .card .dg{width:min(84px,78%)}
.hand .card small{padding:0 4px 8px}
.hand .card.used{grid-column:1 / -1;width:100%}
.hand .card:hover:not(:disabled){transform:translateY(-6px)}
.hand .card.sel{transform:translateY(-12px);box-shadow:0 0 0 4px #ffd35a,0 12px 22px rgba(0,0,0,.45)}
.hand .card:disabled{opacity:.6;filter:saturate(.5)}
.card.used{background:transparent;box-shadow:none;border:2px dashed #3a352a;color:#756d5a;justify-content:center;align-items:center;min-height:150px;font-size:12px;font-weight:700}
.mini-back{width:26px;height:36px;border-radius:5px;border:2px solid #f4ecdc;display:inline-block}

/* game */
.game{max-width:1240px;margin:0 auto;padding:24px 28px 48px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.gcol{flex:999 1 520px;min-width:0;max-width:800px;display:flex;flex-direction:column;gap:12px}
.gside{flex:1 1 340px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:16px}
.opp{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opp .who{font-weight:700}
.backs{display:flex;gap:4px}
.board{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));width:100%;max-width:min(780px,max(380px,calc(100vh - 210px)));gap:1px;border:10px solid #4a2f1d;border-radius:8px;container-type:inline-size;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sq{position:relative;border:0;padding:0;aspect-ratio:1;display:block;overflow:visible;cursor:pointer;font:inherit}
.sq:has(.fx){z-index:7}
.sq:focus-visible{outline:3px solid #fff;outline-offset:-3px;z-index:9}
.sq.sel{box-shadow:inset 0 0 0 3px #ffd35a}
.lastm{position:absolute;inset:0;background:rgba(255,214,90,.38)}
.coord{position:absolute;font-size:max(8px,1cqw);font-weight:800;z-index:2;line-height:1;pointer-events:none}
.coord.r{left:4%;top:5%}
.coord.f{right:5%;bottom:4%}
.pcs{position:absolute;left:7%;top:5%;width:86%;height:86%;z-index:3;pointer-events:none;overflow:visible}
.pcs.nobody{opacity:.72}
.pcs.fresh{animation:land .3s ease-out}
.pcs.slide{animation:slide .3s cubic-bezier(.3,.7,.2,1);z-index:6}
@keyframes land{0%{transform:scale(1.5) translateY(-18%);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes slide{0%{transform:translate(calc(var(--dx) * 100%),calc(var(--dy) * 100%)) scale(1.15)}100%{transform:none}}
.board.shake{animation:shake .34s ease-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
/* attribute pips: one coloured dot per attribute (max 3), across the top of the square */
.pips{position:absolute;left:4%;right:4%;top:3%;display:flex;justify-content:center;gap:5%;z-index:5;pointer-events:none}
.pip{display:block;width:24%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(10,8,6,.75);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.pip.chk{background:#2fc2b0;border-radius:2px;transform:rotate(45deg) scale(.85)}
.pip.wb{background:#ffb347;border-radius:2px}
.pip.nuke{background:#ff5a2a}
.pip.shield{background:#9fd0ff}
.pip.rally{background:#e8d36a;border-radius:2px 2px 50% 50%}
.pip.anchor{background:#8a8f99;border-radius:2px}
.pip.haste{background:#7cf07c}
.pip.mirror{background:linear-gradient(135deg,#fff 0 45%,#a9a9d6 55%)}
.pip.homeward{background:#c8a96a}
.pip.devour{background:#b04aff}
.pip.blink{background:#5ae0ff;border-radius:2px;transform:rotate(45deg) scale(.85)}
.pip.wind{background:#ff9ad0}
.pip.martyr{background:#d02a2a}
.shring{position:absolute;inset:5%;border-radius:50%;box-shadow:0 0 0 2px rgba(159,208,255,.95),0 0 10px 2px rgba(159,208,255,.75);z-index:4;pointer-events:none}
.h-brk:after{width:70%;aspect-ratio:1;border-radius:50%;border:3px dashed #ffd35a;background:rgba(255,211,90,.2)}
.h{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.h:after{content:'';display:block}
.h-dot:after{width:26%;aspect-ratio:1;border-radius:50%;background:rgba(18,16,22,.42)}
.h-cap:after{width:88%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(238,90,60,.95)}
.h-att:after{width:88%;aspect-ratio:1;border-radius:50%;border:3px solid #2fb5a3}
.h-place:after{width:70%;aspect-ratio:1;border-radius:12%;border:2px dashed #ffd35a;background:rgba(255,211,90,.18)}
.hint-line{min-height:48px;color:#cfc7b4}
.hand-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hand-head h3{font-size:22px}
.panel{background:#0f0f14;border:1px solid #2b2820;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:18px}
.turn{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;font-family:'Cormorant Garamond',sans-serif}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #f4efe6;flex:none}
.dot.w{background:#fffaf0}.dot.b{background:#1d1a1f}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:210px;overflow:auto;font-size:14px;color:#cfc7b4}
.modal{position:fixed;inset:0;background:rgba(10,9,13,.72);display:grid;place-items:center;z-index:50;padding:20px}
.dlg{width:min(100%,460px);background:#0f0f14;border:1px solid #3d382c;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto}
.dlg.wide2{width:min(100%,640px)}
.dlg h2{font-size:32px;font-weight:800}
.dlg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.dlg li{display:flex;gap:10px;align-items:flex-start}
.dlg li:before{content:'';flex:none;width:18px;height:18px;border-radius:5px;background:#2fb5a3;margin-top:3px;clip-path:polygon(14% 52%,0 66%,38% 100%,100% 20%,86% 6%,38% 72%)}
.price{font-family:'Cormorant Garamond',sans-serif;font-size:40px;font-weight:800}
.price small{font-size:16px;font-weight:600;color:#9b9484}
.reveal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.reveal .card{animation:deal .45s ease-out both}
@keyframes deal{0%{transform:translateY(24px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}

/* shop + deck */
.shop-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.shop-head h1{font-size:clamp(34px,4vw,52px);font-weight:800}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.item{background:#0f0f14;border:1px solid #2b2820;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.item.eq{border-color:#2fb5a3}
.item h3{font-size:20px}
.item p{font-size:14px;color:#9b9484;min-height:40px}
.stage{position:relative;height:112px;border-radius:10px;background:#17171d;display:grid;place-items:center;container-type:inline-size;overflow:visible}
.sw{width:112px;height:112px;border-radius:10px;border:3px solid #3a352a}
.pair{display:flex;gap:8px;width:100%;height:112px}
.pair div{flex:1;border-radius:10px;display:grid;place-items:center}
.pair svg{width:74%;height:74%}
.cb{width:78px;height:108px;border-radius:9px;border:3px solid #f4ecdc}
.packart{position:relative;width:100%;height:100%}
.pkc{position:absolute;left:50%;top:20px;width:46px;height:66px;margin-left:-23px;border-radius:5px;background:#f6efe0;box-shadow:0 0 0 2px #1d1a1f,0 4px 8px rgba(0,0,0,.45);transform-origin:50% 130%;overflow:hidden;transition:transform .2s ease}
.pkc i{display:block;height:14px;background:var(--c)}
.pkc:after{content:'';position:absolute;left:12px;top:26px;width:22px;height:22px;border-radius:50%;background:var(--c);opacity:.6}
.item:hover .pkc{transform:var(--t) translateY(-4px)}
.pkn{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border:1px solid #4d4736;border-radius:2px;color:#cfc7b4;background:#0d0d12}
.pv{position:absolute;right:8px;bottom:8px;min-height:32px;padding:0 12px;border-radius:8px;border:1px solid #4d4736;background:#0d0d12;font-weight:700;font-size:13px}
.pr{display:flex;align-items:center;gap:8px;font-weight:700}
.cat{display:block;font-style:normal;font-family:'Hanken Grotesk',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.14em;opacity:.7;margin-bottom:1px}
.grp{display:flex;flex-direction:column;gap:18px}
.grphd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.grphd .sech{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 18px;justify-items:center}
.tile.locked .card{opacity:.4;filter:grayscale(.7)}
.tile.locked .ctl{opacity:.6}
.tile{display:flex;flex-direction:column;align-items:center;gap:12px}
.ctl{display:flex;align-items:center;gap:10px;font-weight:700}
.ctl button{width:44px;height:44px;border-radius:10px;border:2px solid #3d382c;background:#17171d;font-size:22px;font-weight:700;line-height:1}
.ctl button:hover:not(:disabled){border-color:#8a7f66}
.ctl button:disabled{opacity:.4}
.ctl span{min-width:64px;text-align:center}

/* kill animations */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;display:block;--r:46px}
.board .fx{--r:30px}
.fx i{position:absolute;left:50%;top:50%;display:block;width:10px;height:10px;margin:-5px 0 0 -5px;opacity:0}
.fx .ghost{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:ghostUp .75s ease-out var(--d) both}
.fx .ghost svg{width:86%;height:86%}
.stage .fx .ghost svg{width:70%;height:70%}
.fx i:nth-child(1){--a:0deg}.fx i:nth-child(2){--a:45deg}.fx i:nth-child(3){--a:90deg}.fx i:nth-child(4){--a:135deg}
.fx i:nth-child(5){--a:180deg}.fx i:nth-child(6){--a:225deg}.fx i:nth-child(7){--a:270deg}.fx i:nth-child(8){--a:315deg}
@keyframes ghostUp{0%{opacity:.95;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-30%) scale(1.3)}}
@keyframes ring{0%{transform:scale(.2);opacity:.95}100%{transform:scale(1.6);opacity:0}}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--r)) rotate(260deg) scale(.35)}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes bolt{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
@keyframes blot{0%{opacity:.95;transform:scale(.1)}60%{opacity:.9;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.fx-fade i{display:none}
.fx-fade:before{content:'';position:absolute;inset:8%;border-radius:50%;border:4px solid #ffd35a;animation:ring .7s ease-out var(--d) both;opacity:0}
.fx-shatter i{width:11px;height:15px;background:#f3e9d2;clip-path:polygon(50% 0,100% 100%,0 100%);animation:burst .7s ease-out var(--d) both}
.fx-shatter i:nth-child(even){background:#ffd35a}
.fx-shatter .ghost{animation-duration:.3s}
.fx-bolt i{display:none}
.fx-bolt:before{content:'';position:absolute;left:-35%;top:-480%;width:170%;height:580%;background:#fff6b0;clip-path:polygon(58% 0,30% 38%,52% 40%,22% 72%,46% 74%,38% 100%,78% 62%,56% 60%,84% 30%,62% 28%,86% 0);animation:bolt .65s ease-out var(--d) both;opacity:0;transform-origin:50% 0}
.fx-bolt:after{content:'';position:absolute;left:-90%;top:-90%;width:280%;height:280%;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,rgba(255,244,160,.75) 40%,transparent 70%);animation:flash .55s ease-out var(--d) both;opacity:0}
.stage .fx-bolt:before{left:calc(50% - 22px);width:44px;top:4%;height:88%}
.stage .fx-bolt:after{left:calc(50% - 50px);top:calc(50% - 50px);width:100px;height:100px}
.fx-nuke i{width:9px;height:9px;border-radius:50%;background:#ff8a2a;animation:burst .7s ease-out var(--d) both}
.fx-nuke:before{content:'';position:absolute;left:-90%;top:-90%;width:280%;height:280%;border-radius:50%;background:radial-gradient(circle,#fff6d0 0 18%,#ffb14a 34%,rgba(255,90,20,.55) 55%,transparent 72%);opacity:0;animation:nuke .85s ease-out var(--d) both}
@keyframes nuke{0%{opacity:1;transform:scale(.1)}60%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.card.act .hd{background:#6f8fd0;color:#0b1020}
.fx-confetti i{width:8px;height:12px;border-radius:2px;animation:burst .95s cubic-bezier(.15,.7,.3,1) var(--d) both}
.fx-confetti i:nth-child(4n+1){background:#c8a96a}.fx-confetti i:nth-child(4n+2){background:#ffd35a}
.fx-confetti i:nth-child(4n+3){background:#2fc2b0}.fx-confetti i:nth-child(4n){background:#e56bd0}
.fx-ink i{width:10px;height:10px;border-radius:50%;background:#0d0b10;box-shadow:0 0 0 2px #f4efe6;animation:burst .6s ease-out var(--d) both}
.fx-embers i{width:7px;height:7px;border-radius:50%;background:#ffb347;box-shadow:0 0 6px 2px rgba(255,120,30,.8);animation:burst .9s ease-out var(--d) both}
.fx-embers i:nth-child(odd){background:#ff6a2a}
.fx-embers:before{content:'';position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.9) 0 20%,rgba(255,90,20,.45) 45%,transparent 70%);animation:flash .7s ease-out var(--d) both;opacity:0}
.fx-frost i{width:6px;height:16px;background:#e6f6ff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 0 1px #7cc4e8;animation:burst .75s ease-out var(--d) both}
.fx-frost:before{content:'';position:absolute;inset:4%;border-radius:50%;border:4px solid #bfe8ff;box-shadow:0 0 10px #7cc4e8;animation:ring .75s ease-out var(--d) both;opacity:0}
.fx-vortex i{display:none}
.fx-vortex:before{content:'';position:absolute;inset:-20%;border-radius:50%;background:conic-gradient(from 0deg,#1a0f2e,#6b3fb0,#0d0b10,#b07cff,#1a0f2e);animation:vortex .9s ease-in var(--d) both;opacity:0}
.fx-vortex .ghost{animation:vsuck .9s ease-in var(--d) both}
@keyframes vortex{0%{opacity:.95;transform:rotate(0) scale(1.2)}100%{opacity:0;transform:rotate(540deg) scale(.1)}}
@keyframes vsuck{0%{opacity:1;transform:rotate(0) scale(1)}100%{opacity:0;transform:rotate(360deg) scale(.1)}}
.fx-ink:before{content:'';position:absolute;inset:-12%;border-radius:46% 54% 50% 50%;background:#0d0b10;opacity:0;animation:blot .75s ease-out var(--d) both}

.card,.card.lg,.hand .card{width:126px;height:176px;padding:4px;border:0;border-radius:9px;background:var(--rim);background-size:100% 100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px #0b0a0c,0 8px 18px rgba(0,0,0,.45);--rim:linear-gradient(140deg,#4a3a28,#9a7f58 22%,#5b4630 45%,#b39468 68%,#4a3a28);--band:#8f2f3b;--bandt:#f6ead6;--gem:#b39468;animation:none}

/* ===== Game layout v2: board + side column on top, the whole hand in one row underneath =====
   --hz scales the hand row (CSS zoom) so all 9 cards fit the screen width and height;
   --bs is the board size: whatever height is left after the hand row, capped by width. */
.game{--hz:1;--bs:max(300px,min(760px,calc(100vh - 262px - 176px * var(--hz)),calc(100vw - 440px)));max-width:none;margin:0;padding:12px 20px 14px;display:grid;grid-template-columns:var(--bs) minmax(260px,380px);grid-template-areas:"board side" "hand hand";justify-content:center;align-items:start;gap:12px 24px}
.game .gcol{grid-area:board;width:var(--bs);max-width:none;flex:none;gap:8px}
.game .board{max-width:none;width:100%}
.game .gside{grid-area:side;max-width:none;flex:none;height:0;min-height:100%;overflow:auto;gap:12px}
.game .gbottom{grid-area:hand;min-width:0}
.game .hint-line{min-height:0;margin:0;font-size:14px}
.gbottom .handpanel{padding:8px 14px 12px}
.gbottom .hand-head{gap:10px}
.gbottom .hand-head h3{font-size:18px}
.handrow{display:flex;gap:12px;align-items:stretch;justify-content:center}
.game .hand{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;padding-top:14px;min-width:0;zoom:var(--hz)}
.game .hand .card{flex:none}
.game .hand .card.used{width:auto;min-width:300px;height:176px}
.handrow .discard-row{flex:0 0 140px;flex-direction:column;flex-wrap:nowrap;gap:8px;padding-top:14px}
.handrow .dz{flex:1 1 auto;min-height:0;font-size:12px;border-radius:4px}
.handrow .btn{font-size:11px;padding:8px 6px}
@media (max-width:1417px),(max-height:940px){.game{--hz:.9}}
@media (max-width:1297px),(max-height:860px){.game{--hz:.8}}
@media (max-width:1178px),(max-height:780px){.game{--hz:.7}}
@media (max-width:1058px),(max-height:700px){.game{--hz:.6}}
@media (max-width:938px){.game{--hz:.5}}
@media (max-width:760px){
  .game{--hz:.55;--bs:calc(100vw - 40px);grid-template-columns:1fr;grid-template-areas:"board" "side" "hand"}
  .game .gside{height:auto;min-height:0}
  .game .hand{flex-wrap:wrap}
  .handrow{flex-direction:column}
  .handrow .discard-row{flex-basis:auto;flex-direction:row}
}

/* ===== Game layout v3: the game screen is exactly one viewport tall. The hand row takes its natural height
   (scaled by --hz), and the board is the largest square that fits the space left (container query units),
   so the full hand is always on screen without guessing the top bar's height. ===== */
sc-if,sc-for{display:contents}
@media (min-width:761px){
  .app:has(.game){height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .app:has(.game) .top{flex:none}
  .app:has(.game) .game{flex:1 1 auto;min-height:0;grid-template-columns:minmax(0,1fr) minmax(260px,360px);grid-template-rows:minmax(0,1fr) auto;justify-content:stretch;align-items:stretch;padding-top:10px;padding-bottom:10px}
  .app:has(.game) .game .gcol{width:auto;min-height:0;min-width:0}
  .app:has(.game) .game .opp{flex:none;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .app:has(.game) .game .opp .muted{overflow:hidden;text-overflow:ellipsis}
  .app:has(.game) .game .boardbox{flex:1 1 auto;min-height:0;container-type:size;display:flex;justify-content:center;align-items:flex-start}
  .app:has(.game) .game .boardbox .board{box-sizing:border-box;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
  .app:has(.game) .game .hint-line,.app:has(.game) .game .gcol>.row,.app:has(.game) .game .gcol>sc-if{flex:none}
}

.guest{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:6px;border-top:1px solid #2b2820}
.start-foot{margin:6px 0 0;color:#8a7f66;font-size:12px}
.agefld label{font-size:14px;color:#cfc7b4}
.agefld label b{color:#e8cf93;font-variant-numeric:lining-nums}
.agesl{width:100%;max-width:420px;margin-top:8px;accent-color:#c8a96a;height:28px;cursor:pointer}
.agescale{display:flex;justify-content:space-between;max-width:420px;font-size:11px;color:#8a7f66;font-style:normal}
.agescale i{font-style:normal}

.guest-q{margin:0;font-weight:600;color:#f4ecdc}

.op7-demo{color:#ffb000;font:700 12px/1.3 'Hanken Grotesk',sans-serif;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px}
.op7-demo:hover{color:#e2d8c4}
a.op7-cta:hover{background:#e2d8c4;color:#110d0a}

.lockmsg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-size:14px;color:#cfc7b4}
.pick{margin:6px 0 4px}
.frate{margin-left:auto;font-size:12px;color:#c8a96a;font-variant-numeric:lining-nums}

/* ===== Game layout v4 (2026-10-27): board on top, the hand under it, then a dock with the turn panel and Moves.
   Everything under the board has a fixed height, so the board never changes size between turns. ===== */
.lockmsg.err{color:#ff9a8a}
.gside .tpanel .turn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gside .tpanel .caps{margin-left:auto;font-size:13px}
.gside .tpanel .hint-line{margin:0;font-size:14px;line-height:1.35;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gside .tpanel .row{flex-wrap:nowrap}
@media (min-width:761px){
  .app:has(.game) .game{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"board" "hand" "side";gap:10px}
  .app:has(.game) .game .boardbox{justify-content:center}
  .app:has(.game) .game .opp{justify-content:center}
  .app:has(.game) .game .gside{flex-direction:row;height:88px;min-height:0;overflow:visible;gap:12px}
  .app:has(.game) .game .gside .tpanel{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;column-gap:14px;align-items:start}
  .app:has(.game) .game .gside .tpanel>sc-if:first-child,.app:has(.game) .game .gside .tpanel .turn{grid-column:1}
  .app:has(.game) .game .gside .tpanel .hint-line{grid-column:1;font-size:13px}
  .app:has(.game) .game .gside .tpanel .row{grid-column:2;grid-row:1 / span 2;align-self:center;gap:8px}
  .app:has(.game) .game .gside .tpanel .btn{padding:9px 14px;font-size:11px}
  .app:has(.game) .game .gbottom .hand-head{line-height:1.1}
  .app:has(.game) .game .gside .panel{min-height:0;overflow:auto;padding:10px 16px;gap:6px;border-radius:12px}
  .app:has(.game) .game .gside .tpanel{flex:0 1 640px}
  /* tutorial: coach and board meet in the middle (coach right-aligned in the left half, board left-aligned in the right half) */
  .app:has(.game) .game.tut{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"coach board" "hand hand" "side side"}
  .app:has(.game) .game .coachside{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-self:end;width:min(100%,400px)}
  .app:has(.game) .game .coachside>.panel{margin:auto 0;padding:14px 16px;gap:8px}
  .app:has(.game) .game .coachside .coach h3{font-size:20px}
  .app:has(.game) .game .coachside .coach p{font-size:13.5px;line-height:1.4;margin:0 0 6px}
  .app:has(.game) .game.tut .boardbox,.app:has(.game) .game.tut .opp{justify-content:flex-start}
  .app:has(.game) .game .gside .mpanel{flex:1 1 320px;overflow:hidden}
  .app:has(.game) .game .gside .mpanel h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .app:has(.game) .game .gside .mpanel .log{max-height:none;flex:1 1 auto;min-height:0;font-size:13px}
}
.game .coachside{grid-area:coach}
@media (max-width:760px){
  .game{grid-template-areas:"board" "hand" "side"}
  .game.tut{grid-template-areas:"coach" "board" "hand" "side"}
  .game .gside .tpanel .hint-line{-webkit-line-clamp:3}
}

/* Snare: a dashed ring that turns slowly while the piece is held */
.snring{position:absolute;inset:9%;border-radius:50%;border:2px dashed #e8774f;z-index:4;pointer-events:none;animation:snspin 7s linear infinite}
@keyframes snspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.snring{animation:none}}
</style>
<style>html,body{margin:0;min-height:100%;background:#0b0a0e}#app{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">

<div class="app">

<template data-sc-if value="{{isApp}}" hint-placeholder-val="{{ true }}">
<template data-sc-if value="{{showTop}}" hint-placeholder-val="{{ false }}">
<header class="top">
  <button type="button" class="brand brandbtn" onClick="{{goHome}}"><i><svg viewBox="0 0 100 100" aria-hidden="true"><path d="{{logoD}}" fill="#c8a96a"></path></svg></i> MorphCard</button>
  <nav class="nav" aria-label="Main">
    <button type="button" class="tab" onClick="{{goHome}}">Menu</button>
    <button type="button" class="{{deckTabCls}}" onClick="{{goDeck}}">Deck</button>
    <button type="button" class="{{shopTabCls2}}" onClick="{{goShop}}">Shop</button>
  </nav>
  <div class="right">
    <span class="pill" title="Coins"><span class="coin"></span>{{coins}} Coins</span>
    <button type="button" class="btn btn-g" aria-pressed="{{muted}}" onClick="{{toggleMute}}">{{soundLabel}}</button>
  </div>
</header>
</template>

<template data-sc-if value="{{isStart}}" hint-placeholder-val="{{ false }}">
<main class="home start">
  <div class="home-bg" aria-hidden="true"></div>
  <div class="start-in">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="{{logoD}}" fill="none" stroke="#c8a96a" stroke-width="3" stroke-linejoin="round"></path></svg>
      <h1>MorphCard</h1>
    </div>
    <p class="tag">A card battler in the shifting caves</p>
    <template data-sc-if value="{{netErr}}" hint-placeholder-val="{{ false }}"><p class="err net-err" role="alert">{{netErr}}</p></template>
    <template data-sc-if value="{{netMsg}}" hint-placeholder-val="{{ false }}"><p class="ok-note net-msg" role="status">{{netMsg}}</p></template>
    <template data-sc-if value="{{netSigningIn}}" hint-placeholder-val="{{ false }}"><p class="muted" role="status">Signing you in…</p></template>
  <template data-sc-if value="{{netShowEmail}}" hint-placeholder-val="{{ true }}">
  <section class="on-card net-card">
    <h2 class="sech">Sign in</h2>
    <p>Save your progress to your account and play your friends online. We'll email you a sign-in code; no password needed.</p>
    <label class="fld"><span>Email</span><input type="email" autocomplete="email" placeholder="you@example.com" value="{{netEmail}}" onInput="{{netEmailIn}}" onKeyDown="{{netEmailKey}}"></label>
    <div class="row"><button type="button" class="btn btn-p" disabled="{{netBusy}}" onClick="{{netSendCode}}">Email me a code</button></div>
    <p class="muted small">Online accounts are for players 13 and older. We store your email, your player name, your friends and your match results to run online play. <a class="plink" href="https://morphcard.net/privacy/" target="_blank" rel="noopener">Privacy policy</a></p>
  </section>
  </template>

  <template data-sc-if value="{{netCodeSent}}" hint-placeholder-val="{{ false }}">
  <section class="on-card net-card">
    <h2 class="sech">Check your email</h2>
    <p>Enter the code we sent to <b>{{netEmail}}</b>. It can take a minute; check spam too.</p>
    <label class="fld"><span>Code</span><input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code from the email" value="{{netCode}}" onInput="{{netCodeIn}}" onKeyDown="{{netCodeKey}}"></label>
    <div class="row">
      <button type="button" class="btn btn-p" disabled="{{netBusy}}" onClick="{{netVerify}}">Sign in</button>
      <button type="button" class="btn btn-g" onClick="{{netBackToEmail}}">Use a different email</button>
    </div>
  </section>
  </template>

  <template data-sc-if value="{{netSetupCard}}" hint-placeholder-val="{{ false }}">
  <section class="on-card net-card">
    <h2 class="sech">{{netProfileTitle}}</h2>
    <p>Friends see your name: 3-16 letters, numbers or underscores. You'll get a friend code to share.</p>
    <label class="fld"><span>Player name</span><input type="text" maxlength="16" placeholder="CaveRunner" value="{{netName}}" onInput="{{netNameIn}}" onKeyDown="{{netNameKey}}"></label>
    <div class="fld agefld"><label for="agesl">Your age: <b>{{netAgeLabel}}</b></label>
      <input id="agesl" class="agesl" type="range" min="6" max="60" step="1" value="{{netAgeVal}}" aria-valuetext="{{netAgeLabel}}" onInput="{{netAgeIn}}" onChange="{{netAgeIn}}">
      <span class="agescale" aria-hidden="true"><i>6</i><i>13</i><i>17</i><i>60+</i></span>
    </div>
    <label class="fld"><span>Your state, for state leaderboards (optional)</span>
      <select onChange="{{netRegionIn}}"><template data-sc-for list="{{netRegions}}" as="r" hint-placeholder-count="3"><option value="{{r.v}}" selected="{{r.sel}}">{{r.label}}</option></template></select>
    </label>
    <template data-sc-if value="{{netUnder13}}" hint-placeholder-val="{{ false }}"><p class="err">Online play is for players 13 and older. You can still play the tutorial, the bot and Pass &amp; Play.</p></template>
    <p class="muted small">Your age stays on this device. We only keep two yes/no answers: whether you're 13 or older (needed for online play) and whether you're 17 or older (for 17+ promotions).</p>
    <div class="row"><button type="button" class="btn btn-p" disabled="{{netNoSave}}" onClick="{{netSaveName}}">Save</button><template data-sc-if value="{{netEditing}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-g" onClick="{{netCancelEdit}}">Cancel</button></template><button type="button" class="btn btn-g" onClick="{{netSignOut}}">Sign out</button></div>
  </section>
  </template>

    <div class="guest">
      <template data-sc-if value="{{guestAskOff}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-g" onClick="{{startGuest}}">Play as guest</button></template>
      <template data-sc-if value="{{guestAsk}}" hint-placeholder-val="{{ false }}">
        <p class="guest-q" id="guestq">One question before you play: are you 17 or older?</p>
        <div class="row" role="group" aria-labelledby="guestq">
          <button type="button" class="btn btn-p" onClick="{{guestOver17}}">Yes, 17 or older</button>
          <button type="button" class="btn btn-g" onClick="{{guestUnder17}}">No</button>
          <button type="button" class="btn btn-g" onClick="{{guestBack}}">Back</button>
        </div>
      </template>
      <p class="muted small">Guests play the tutorial, the bot and Pass &amp; Play. Progress stays on this device, and you can sign in any time from the menu. Your answer is only used to decide whether to show promotions for 17+ games and never leaves this device.</p>
    </div>
    <p class="start-foot"><a class="plink" href="https://morphcard.net/privacy/" target="_blank" rel="noopener">Privacy policy</a> · Rated Teen 13+</p>
  </div>
</main>
</template>

<template data-sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<main class="home">
  <div class="home-bg" aria-hidden="true"></div>
  <div class="home-in">
    <section class="home-l">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="{{logoD}}" fill="none" stroke="#c8a96a" stroke-width="3" stroke-linejoin="round"></path></svg>
        <h1>MorphCard</h1>
      </div>
      <p class="tag">A card battler in the shifting caves</p>
      <nav class="menu" aria-label="Main menu">
        <template data-sc-if value="{{showTutItem}}" hint-placeholder-val="{{ true }}"><button type="button" class="mi primary" onClick="{{startTut}}"><span class="mi-t">Tutorial</span><span class="mi-s">{{tutMenuSub}}</span></button></template>
        <template data-sc-if value="{{showOnlineItem}}" hint-placeholder-val="{{ true }}"><button type="button" class="mi" onClick="{{goOnline}}"><span class="mi-t">Play Online</span><span class="mi-s">Add friends and play them anywhere.</span></button></template>
        <button type="button" class="{{playLocalCls}}" disabled="{{deckBad}}" onClick="{{openPick}}"><span class="mi-t">Pass &amp; Play</span><span class="mi-s">Play a friend on this device, or the bot.</span></button>
        <button type="button" class="mi" onClick="{{goDeck}}"><span class="mi-t">Deck</span><span class="mi-s">{{deckTotal}} / {{deckSize}} cards ready</span></button>
        <button type="button" class="mi" onClick="{{goShop}}"><span class="mi-t">Shop</span><span class="mi-s">{{shopMenuSub}}</span></button>
        <button type="button" class="mi" onClick="{{openHow}}"><span class="mi-t">How to Play</span><span class="mi-s">The rules in one minute</span></button>
      </nav>
      <template data-sc-if value="{{deckBad}}" hint-placeholder-val="{{ false }}"><p class="err" role="alert">Your deck needs exactly {{deckSize}} cards. It has {{deckTotal}} now. Fix it in Deck.</p></template>
    </section>
    <section class="home-r">
      <div class="fan" aria-hidden="true">
        <template data-sc-for list="{{showCards}}" as="card" hint-placeholder-count="3">
          <div class="{{card.cls}} lg">
            <span class="cf"><span class="ctop"><span class="ctx"><em class="cat">{{card.cat}}</em><span class="ctt">{{card.title}}</span></span><i class="gem" title="{{card.rname}}"></i></span><span class="art"><template data-sc-if value="{{card.once}}" hint-placeholder-val="{{ false }}"><span class="once" title="One use: spent after it triggers"><b>1&#215;</b>One use</span></template><span class="dg"><template data-sc-for list="{{card.dg}}" as="d" hint-placeholder-count="25"><i class="{{d}}"></i></template><svg class="dgp" viewBox="0 0 100 100"><path d="{{card.pd}}" fill="#fffaf0" stroke="#2a2118" stroke-width="7" stroke-linejoin="round" style="paint-order:stroke"></path></svg></span></span><small>{{card.sub}}</small><span class="cfoot"><span>{{card.no}}</span><span class="micro">MORPHCARD &#183; OFFICIAL</span><span>{{card.rl}}</span></span></span>
          </div>
        </template>
      </div>
      <template data-sc-if value="{{showOp7}}" hint-placeholder-val="{{ false }}">
        <aside class="op7" aria-label="Promotion: Observation Post 7">
          <span class="op7-kicker">From the same studio</span>
          <img class="op7-img" src="{{op7Header}}" alt="Observation Post 7" width="640" height="299">
          <p class="op7-tag">{{op7Tag}}</p>
          <a class="op7-demo" href="{{op7ItchUrl}}" target="_blank" rel="noopener noreferrer">Play the free demo on itch.io</a>
          <div class="op7-row"><span class="op7-rate">{{op7Rating}}</span><template data-sc-if value="{{op7Live}}" hint-placeholder-val="{{ false }}"><a class="op7-cta" href="{{op7Url}}" target="_blank" rel="noopener">{{op7Cta}}</a></template><template data-sc-if value="{{op7NoLink}}" hint-placeholder-val="{{ true }}"><span class="op7-cta off">{{op7Cta}}</span></template><a class="op7-cta" href="{{op7ItchUrl}}" target="_blank" rel="noopener noreferrer">{{op7ItchLabel}}</a></div>
        </aside>
      </template>
    </section>
  </div>
  <footer class="home-foot">
    <div class="stats">
      <div class="st"><b><span class="coin"></span> {{coins}}</b><span>Coins</span></div>
      <div class="st"><b>{{wins}}</b><span>Wins</span></div>
      <div class="st"><b>{{streak}}</b><span>Win streak</span></div>
      <div class="st"><b>{{played}}</b><span>Matches</span></div>
    </div>
    <div class="row">
      <button type="button" class="btn btn-g" aria-pressed="{{muted}}" onClick="{{toggleMute}}">{{soundLabel}}</button>
      <template data-sc-if value="{{showReset}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-g" aria-pressed="{{resetArm}}" onClick="{{resetClick}}">{{resetLabel}}</button></template>
      <template data-sc-if value="{{homeGuest}}" hint-placeholder-val="{{ false }}"><span class="muted signed">Playing as guest</span><button type="button" class="btn btn-s" onClick="{{homeSignIn}}">Sign in</button></template>
      <template data-sc-if value="{{homeSignedIn}}" hint-placeholder-val="{{ false }}"><span class="muted signed">Signed in as <b>{{homeUser}}</b></span><button type="button" class="btn btn-g" onClick="{{homeSignOut}}">Sign out</button></template>
      <a class="plink" href="https://morphcard.net/privacy/" target="_blank" rel="noopener">Privacy</a>
      <span class="muted ver">Rated Teen 13+ · v0.1 demo · progress saves in this browser</span>
    </div>
  </footer>
</main>
</template>
<template data-sc-if value="{{isDeck}}" hint-placeholder-val="{{ false }}">
<div class="page">
<div class="home-bg" aria-hidden="true"></div>
<main class="wrap page-in">
  <div class="phead">
    <button type="button" class="back" onClick="{{goHome}}">Main menu</button>
    <div class="ptitle"><span class="tag">Build your hand</span><h1>Deck</h1></div>
    <div class="pright">
      <span class="pill"><span class="coin"></span>{{coins}} Coins</span>
      <button type="button" class="btn btn-g" aria-pressed="{{muted}}" onClick="{{toggleMute}}">{{soundLabel}}</button>
    </div>
  </div>
  <div class="pbar">
    <div class="pmeter {{deckCls}}"><b>{{deckTotal}}<em class="sl">/</em><em class="of">{{deckSize}}</em></b><span>cards in deck</span><i class="pfill" style="width: {{deckPct}}"></i></div>
    <p class="{{deckMsgCls}}" role="status">{{deckMsg}} Up to {{pieceMax}} Piece cards.</p>
    <div class="row">
      <template data-sc-if value="{{deckEditable}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-p" onClick="{{fillDeck}}">Fill to {{deckSize}}</button>
      <button type="button" class="btn btn-g" onClick="{{resetDeck}}">Reset to default</button></template>
      <template data-sc-if value="{{hasDeckErr}}" hint-placeholder-val="{{ false }}"><p class="lockmsg err" role="alert">{{deckErr}}</p></template>
      <template data-sc-if value="{{deckLocked}}" hint-placeholder-val="{{ false }}"><p class="lockmsg">Guests play the starter deck. <button type="button" class="btn btn-s" onClick="{{homeSignIn}}">Sign in</button> to buy card packs and build your own deck.</p></template>
    </div>
  </div>
  <template data-sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
  <section class="grp {{grp.gcls}}">
  <div class="grphd"><h2 class="sech"><template data-sc-if value="{{grp.hasLeg}}" hint-placeholder-val="{{ false }}"><span class="sublegend {{grp.gcls}}" aria-hidden="true"></span></template>{{grp.name}}</h2><span class="muted">{{grp.note}}</span></div>
  <div class="tiles">
    <template data-sc-for list="{{grp.tiles}}" as="t" hint-placeholder-count="4">
      <div class="tile {{t.tcls}}">
        <div class="{{t.cls}}">
          <span class="cf"><span class="ctop"><span class="ctx"><em class="cat">{{t.cat}}</em><span class="ctt">{{t.title}}</span></span><i class="gem" title="{{t.rname}}"></i></span><span class="art"><template data-sc-if value="{{t.once}}" hint-placeholder-val="{{ false }}"><span class="once" title="One use: spent after it triggers"><b>1&#215;</b>One use</span></template><span class="dg"><template data-sc-for list="{{t.dg}}" as="d" hint-placeholder-count="25"><i class="{{d}}"></i></template><svg class="dgp" viewBox="0 0 100 100"><path d="{{t.pd}}" fill="#fffaf0" stroke="#2a2118" stroke-width="7" stroke-linejoin="round" style="paint-order:stroke"></path></svg></span></span><small>{{t.sub}}</small><span class="cfoot"><span>{{t.no}}</span><span class="micro">MORPHCARD &#183; OFFICIAL</span><span>{{t.rl}}</span></span></span>
        </div>
        <div class="ctl">
          <button type="button" aria-label="Remove one {{t.title}}" disabled="{{t.noDec}}" onClick="{{t.dec}}">&minus;</button>
          <span>{{t.inDeck}} of {{t.owned}}</span>
          <button type="button" aria-label="Add one {{t.title}}" disabled="{{t.noInc}}" onClick="{{t.inc}}">+</button>
        </div>
      </div>
    </template>
  </div>
  </section>
  </template>
</main>
</div>
</template>

<template data-sc-if value="{{isOnline}}" hint-placeholder-val="{{ false }}">
<div class="page">
<div class="home-bg" aria-hidden="true"></div>
<main class="wrap page-in">
  <div class="phead">
    <button type="button" class="back" onClick="{{goHome}}">Main menu</button>
    <div class="ptitle"><span class="tag">Play your friends</span><h1>Online</h1></div>
    <div class="pright">
      <span class="pill"><span class="coin"></span>{{coins}} Coins</span>
      <button type="button" class="btn btn-g" aria-pressed="{{muted}}" onClick="{{toggleMute}}">{{soundLabel}}</button>
    </div>
  </div>
  <template data-sc-if value="{{netErr}}" hint-placeholder-val="{{ false }}"><p class="err net-err" role="alert">{{netErr}}</p></template>
  <template data-sc-if value="{{netMsg}}" hint-placeholder-val="{{ false }}"><p class="ok-note net-msg" role="status">{{netMsg}}</p></template>
  <template data-sc-if value="{{netLoading}}" hint-placeholder-val="{{ false }}"><p class="muted" role="status">Connecting…</p></template>

  <template data-sc-if value="{{netEditCard}}" hint-placeholder-val="{{ false }}">
  <section class="on-card net-card">
    <h2 class="sech">{{netProfileTitle}}</h2>
    <p>Friends see your name: 3-16 letters, numbers or underscores. You'll get a friend code to share.</p>
    <label class="fld"><span>Player name</span><input type="text" maxlength="16" placeholder="CaveRunner" value="{{netName}}" onInput="{{netNameIn}}" onKeyDown="{{netNameKey}}"></label>
    <div class="fld agefld"><label for="agesl">Your age: <b>{{netAgeLabel}}</b></label>
      <input id="agesl" class="agesl" type="range" min="6" max="60" step="1" value="{{netAgeVal}}" aria-valuetext="{{netAgeLabel}}" onInput="{{netAgeIn}}" onChange="{{netAgeIn}}">
      <span class="agescale" aria-hidden="true"><i>6</i><i>13</i><i>17</i><i>60+</i></span>
    </div>
    <label class="fld"><span>Your state, for state leaderboards (optional)</span>
      <select onChange="{{netRegionIn}}"><template data-sc-for list="{{netRegions}}" as="r" hint-placeholder-count="3"><option value="{{r.v}}" selected="{{r.sel}}">{{r.label}}</option></template></select>
    </label>
    <template data-sc-if value="{{netUnder13}}" hint-placeholder-val="{{ false }}"><p class="err">Online play is for players 13 and older. You can still play the tutorial, the bot and Pass &amp; Play.</p></template>
    <p class="muted small">Your age stays on this device. We only keep two yes/no answers: whether you're 13 or older (needed for online play) and whether you're 17 or older (for 17+ promotions).</p>
    <div class="row"><button type="button" class="btn btn-p" disabled="{{netNoSave}}" onClick="{{netSaveName}}">Save</button><template data-sc-if value="{{netEditing}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-g" onClick="{{netCancelEdit}}">Cancel</button></template><button type="button" class="btn btn-g" onClick="{{netSignOut}}">Sign out</button></div>
  </section>
  </template>

  <template data-sc-if value="{{netReady}}" hint-placeholder-val="{{ false }}">
  <div class="on-grid">
    <section class="on-card">
      <h2 class="sech">{{netMyName}}</h2>
      <p class="muted">Your friend code. Share it so friends can add you.</p>

    <section class="on-card">

<template data-sc-if value="{{isGame}}" hint-placeholder-val="{{ false }}">
<main class="game {{gameCls}}">
  <template data-sc-if value="{{isTut}}" hint-placeholder-val="{{ false }}">
  <aside class="coachside">
    <div class="panel coach" role="region" aria-label="Tutorial coach">
      <div class="coach-top"><span class="tag">Lesson {{tutNo}} of {{tutCount}}</span><span class="tdots"><template data-sc-for list="{{tutDots}}" as="d" hint-placeholder-count="7"><i class="{{d.cls}}"></i></template></span></div>
      <h3>{{tutTitle}}</h3>
      <p>{{tutText}}</p>
      <template data-sc-if value="{{tutWorking}}" hint-placeholder-val="{{ true }}"><p class="coach-step" role="status"><b>Your turn {{tutTurn}} · Step {{tutStepNo}} of {{tutSteps}}</b>{{tutHint}}</p></template>
      <template data-sc-if value="{{tutDoneNow}}" hint-placeholder-val="{{ false }}">
        <p class="coach-done" role="status"><b>Lesson complete.</b> {{tutDoneText}}</p>
        <div class="row"><button type="button" class="btn btn-p" onClick="{{tutNext}}">Next lesson</button></div>
      </template>
      <div class="row coach-ctl">
        <button type="button" class="btn btn-g" onClick="{{tutRestart}}">Restart lesson</button>
        <button type="button" class="btn btn-g" onClick="{{tutSkip}}">{{tutSkipLabel}}</button>
        <button type="button" class="btn btn-g" onClick="{{tutExit}}">Exit</button>
      </div>
    </div>
  </aside>
  </template>
  <div class="gcol">
    <div class="opp">
      <span class="dot {{oppDot}}"></span><span class="who">{{oppName}}</span>
      <div class="backs"><template data-sc-for list="{{oppBacks}}" as="b" hint-placeholder-count="3"><span class="mini-back" style="{{b.style}}"><b class="bm">M</b></span></template></div>
      <span class="muted">{{oppCards}} in hand, {{oppDeck}} to draw, {{oppDisc}} discarded</span>
    </div>

    <div class="boardbox">
    <div class="board {{boardCls}}" style="border-color: {{boardFrame}}; background: {{boardFrame}}">
      <template data-sc-for list="{{cells}}" as="cell" hint-placeholder-count="256">
        <button type="button" class="sq {{cell.cls}}" style="background: {{cell.bg}}" aria-label="{{cell.label}}" onClick="{{cell.click}}" onDragOver="{{cell.dragOver}}" onDrop="{{cell.drop}}">
          <template data-sc-if value="{{cell.wall}}" hint-placeholder-val="{{ false }}"><span class="rock" style="box-shadow: {{cell.shadow}}"></span></template>
          <template data-sc-if value="{{cell.last}}" hint-placeholder-val="{{ false }}"><span class="lastm"></span></template>
          <template data-sc-if value="{{cell.hasRank}}" hint-placeholder-val="{{ false }}"><span class="coord r" style="color: {{cell.coordColor}}">{{cell.rank}}</span></template>
          <template data-sc-if value="{{cell.hasFile}}" hint-placeholder-val="{{ false }}"><span class="coord f" style="color: {{cell.coordColor}}">{{cell.file}}</span></template>
          <template data-sc-if value="{{cell.piece}}" hint-placeholder-val="{{ false }}"><svg class="pcs {{cell.pcCls}}" viewBox="0 0 100 100" style="{{cell.pcStyle}}" aria-hidden="true"><path d="{{cell.pd}}" fill="{{cell.fill}}" stroke="{{cell.edge}}" stroke-width="6" stroke-linejoin="round" style="paint-order:stroke"></path></svg></template>
          <template data-sc-if value="{{cell.shielded}}" hint-placeholder-val="{{ false }}"><span class="shring"></span></template>
          <template data-sc-if value="{{cell.snared}}" hint-placeholder-val="{{ false }}"><span class="snring"></span></template>
          <template data-sc-if value="{{cell.hasPips}}" hint-placeholder-val="{{ false }}"><span class="pips"><template data-sc-for list="{{cell.pips}}" as="pp" hint-placeholder-count="2"><i class="pip {{pp}}"></i></template></span></template>
          <template data-sc-if value="{{cell.hasHint}}" hint-placeholder-val="{{ false }}"><span class="h {{cell.hint}}"></span></template>
          <template data-sc-if value="{{cell.fx}}" hint-placeholder-val="{{ false }}">
            <span class="fx fx-{{cell.fxAnim}}" style="--d: {{cell.fxDelay}}"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b class="ghost"><svg viewBox="0 0 100 100"><path d="{{cell.fxD}}" fill="{{cell.fxFill}}" stroke="{{cell.fxEdge}}" stroke-width="6" stroke-linejoin="round" style="paint-order:stroke"></path></svg></b></span>
          </template>
        </button>
      </template>
    </div>
    </div>

  </div>


  <section class="gbottom" aria-label="Your hand">
    <div class="panel handpanel {{handCls}}" style="{{handStyle}}">
    <div class="hand-head"><h3>{{handTitle}}</h3><span class="muted">{{handSub}}</span></div>
    <div class="handrow">
    <div class="hand">
      <template data-sc-for list="{{hand}}" as="card" hint-placeholder-count="5">
        <button type="button" class="{{card.cls}}" disabled="{{card.disabled}}" draggable="{{card.draggable}}" onDragStart="{{card.dragStart}}" onDragEnd="{{card.dragEnd}}" aria-pressed="{{card.selected}}" aria-label="{{card.label}}" onClick="{{card.click}}">
          <span class="cf"><span class="ctop"><span class="ctx"><em class="cat">{{card.cat}}</em><span class="ctt">{{card.title}}</span></span><i class="gem" title="{{card.rname}}"></i></span><span class="art"><template data-sc-if value="{{card.once}}" hint-placeholder-val="{{ false }}"><span class="once" title="One use: spent after it triggers"><b>1&#215;</b>One use</span></template><span class="dg"><template data-sc-for list="{{card.dg}}" as="d" hint-placeholder-count="25"><i class="{{d}}"></i></template><svg class="dgp" viewBox="0 0 100 100"><path d="{{card.pd}}" fill="#fffaf0" stroke="#2a2118" stroke-width="7" stroke-linejoin="round" style="paint-order:stroke"></path></svg></span></span><small>{{card.sub}}</small><span class="cfoot"><span>{{card.no}}</span><span class="micro">MORPHCARD &#183; OFFICIAL</span><span>{{card.rl}}</span></span></span>
        </button>
      </template>
      <template data-sc-if value="{{handEmpty}}" hint-placeholder-val="{{ false }}"><div class="card used">Hand empty</div></template>
    </div>
    <div class="discard-row">
      <div class="dz {{dzCls}}" onDragOver="{{dzOver}}" onDrop="{{dzDrop}}">Drag a card here to discard it (ends your turn)</div>
      <button type="button" class="btn btn-s" disabled="{{noDiscard}}" onClick="{{discardSel}}">Discard selected card</button>
    </div>
    </div>
    </div>
  </section>

  <aside class="gside">
    <div class="panel tpanel">
      <template data-sc-if value="{{notTut}}" hint-placeholder-val="{{ true }}"><div class="turn"><span class="dot {{turnDot}}"></span>{{turnText}}<span class="muted caps">Captures: {{capText}}</span></div></template>
      <p class="hint-line" role="status">{{hintLine}}</p>
      <div class="row">
        <template data-sc-if value="{{chaining}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-p" onClick="{{finishCapture}}">Finish turn</button></template>
        <template data-sc-if value="{{notTut}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-g" onClick="{{resign}}">Resign</button>
        <button type="button" class="btn btn-g" onClick="{{goHome}}">Leave</button></template>
      </div>
    </div>
    <div class="panel mpanel">
      <h3>Moves</h3>
      <ol class="log" reversed>
        <template data-sc-for list="{{logLines}}" as="l" hint-placeholder-count="3"><li>{{l.t}}</li></template>
      </ol>
    </div>
  </aside>

  <template data-sc-if value="{{showBan}}" hint-placeholder-val="{{ false }}"><div class="{{banCls}}" aria-hidden="true">{{banText}}</div></template>

  <template data-sc-if value="{{hasOver}}" hint-placeholder-val="{{ false }}">
    <div class="modal">
      <div class="dlg" role="dialog" aria-modal="true" aria-label="Game over">
        <h2 class="{{overCls}}">{{overTitle}}</h2>
        <p class="muted">{{overSub}}</p>
        <template data-sc-if value="{{hasReward}}" hint-placeholder-val="{{ false }}">
          <div class="reward"><span class="coin big"></span><b>+{{rewardAmt}}</b><span>Coins</span></div>
          <p class="muted">{{rewardWhy}}</p>
        </template>
        <div class="ostats"><span>Wins <b>{{wins}}</b></span><span>Streak <b>{{streak}}</b></span><span>Best <b>{{best}}</b></span></div>
        <template data-sc-if value="{{showOp7}}" hint-placeholder-val="{{ false }}">
          <aside class="op7 op7-strip" aria-label="Promotion: Observation Post 7"><img class="op7-thumb" src="{{op7Small}}" alt="Observation Post 7" width="462" height="174"><div class="op7-strip-txt"><span class="op7-kicker">From the same studio</span><span class="op7-rate">{{op7Rating}}</span><template data-sc-if value="{{op7Live}}" hint-placeholder-val="{{ false }}"><a class="op7-cta" href="{{op7Url}}" target="_blank" rel="noopener">{{op7Cta}}</a></template><template data-sc-if value="{{op7NoLink}}" hint-placeholder-val="{{ true }}"><span class="op7-cta off">{{op7Cta}}</span></template><a class="op7-cta" href="{{op7ItchUrl}}" target="_blank" rel="noopener noreferrer">{{op7ItchLabel}}</a></div></aside>
        </template>
        <div class="row">
          <button type="button" class="btn btn-p" onClick="{{rematch}}">{{againLabel}}</button>
          <button type="button" class="btn btn-g" onClick="{{goHome}}">Main menu</button>
        </div>
      </div>
    </div>
  </template>
</main>
</template>

<template data-sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">

<div class="home-bg" aria-hidden="true"></div>
<main class="wrap page-in">

<template data-sc-if value="{{showHow}}" hint-placeholder-val="{{ false }}">
  <div class="modal">
    <div class="dlg wide2" role="dialog" aria-modal="true" aria-label="How to play">
      <h2>How to Play</h2>
      <ol class="how">
        <li><span>Each turn, do one thing: move a piece, play a card or discard one.</span></li>
        <li><span>Cards come in four kinds: Piece, Movement, Attribute and Action. A deck holds up to {{pieceMax}} Piece cards.</span></li>
        <li><span>Deal a Piece card on your first two rows, then attach a Movement card to turn it into a moving piece.</span></li>

  async netReward(kind, result, gid) {
    try {
      const r = await this.netCall('reward', { kind: kind, result: result });
      this.applyAccount(r.account);
      const g = this.state.game;
      if (g && g.id === gid && g.over) this.setGame({ over: Object.assign({}, g.over, { reward: r.granted, why: r.why }) });
    } catch (e) {
      const g = this.state.game;
      if (g && g.id === gid && g.over) this.setGame({ over: Object.assign({}, g.over, { reward: 0, why: 'Could not save the reward: ' + ((e && e.message) || 'offline') }) });

        const r = await this.netCall('save_deck', { deck: this.state.deck });
        if (JSON.stringify(this.state.deck) === sent) this._deckDirty = false; /* otherwise a newer edit is still waiting */

  netPreview(g, a) {

      sim.sfx = function () {}; sim.setState = function (p) { Object.assign(sim.state, p); };
      sim.settle = function (ng, fx) { sim.state.game = ng; sim.state.fx = fx || null; };
      sim.perform(a);

      ng.mode = 'online'; ng.matchId = g.matchId; ng.oppName = g.oppName; ng.meName = g.meName; ng.human = me;
      ng.hands = Object.assign({}, ng.hands, { [me]: ng.hands[me].filter(function (t) { return t !== '?'; }), [Component.other(me)]: g.hands[Component.other(me)] });
      ng.decks = g.decks; ng.selected = -1; ng.selCard = -1; ng.note = '';

      ng.fx = sim.state.fx ? Object.assign({}, sim.state.fx, { id: ((g.fx && g.fx.id) || 0) + 1 }) : null;
      if (ng.over) ng.over = null; /* the server announces the result */

      if (ng.fx) { const fid = this.state.fx.id; setTimeout(() => { if (this.state.fx && this.state.fx.id === fid) this.setState({ fx: null }); }, 1500); }

      const lbl = Component.sq(i) + ', ' + (p ? (p.c === 'w' ? 'white ' : 'black ') + (p.body ? PN[ptype] + ' (' + NM[p.body] + ')' : 'pawn head only') + (Component.attrsOf(p).length ? ' with ' + Component.attrsOf(p).map(function (a) { return NM[a]; }).join(', ') : '') : 'empty') + (hint === 'h-cap' ? ', capture' : hint === 'h-dot' ? ', move here' : hint === 'h-place' ? ', place Pawn head here' : hint === 'h-att' ? ', give card' : '');
      cells.push({
        bg: wall ? '#16151a' : (light ? bl.light : bl.dark), cls: (tutStep && tutStep.piece && p && p.c === 'w' && p.body === tutStep.piece && g.selected !== i ? 'coachsq ' : '') + ((g.selected === i || (g.chain && g.chain.sq === i) || (g.haste && g.haste.sq === i) || (g.selCard >= 0 && g.tp >= 0 && g.tp === i)) ? 'sel' : '') + (wall ? ' wallc' : ''), hint: hint, hasHint: !!hint,
        wall: wall, shadow: shadow,
        last: g.lastFrom === i || g.lastTo === i,
        hasRank: c === (flip ? 15 : 0) && !wall, hasFile: r === (flip ? 0 : 15) && !wall, rank: String(16 - r), file: 'abcdefghijklmnop'[c], coordColor: light ? bl.dark : bl.light,
        piece: !!p, pcCls: pcCls, pcStyle: pcStyle, pd: v.pd, fill: v.fill, edge: v.edge, pips: Component.attrsOf(p), hasPips: !!(p && Component.attrsOf(p).length), shielded: !!(p && p.shield), snared: !!(p && p.snared),
        fx: !!fi, fxAnim: s.fx ? s.fx.anim : 'fade', fxDelay: fi ? fi.delay + 's' : '0s', fxD: (fi && fi.nog) ? '' : fv.pd, fxFill: fv.fill, fxEdge: fv.edge,
        label: wall ? (hint === 'h-brk' ? 'Rock wall, a Marcher can break through' : 'Rock wall') : lbl + (p && p.snared ? ', snared' : ''), click: () => this.clickCell(i),
        dragOver: (e) => this.dragOver(e, i), drop: (e) => this.dropCard(e, i)
      });
    }
    vals.cells = cells; vals.boardFrame = bl.frame; vals.boardCls = s.fx ? 'shake' : '';

    const online = g.mode === 'online', oppNm = g.oppName || 'Opponent';
    const viewer = g.mode === 'bot' || online ? g.human : g.turn, opp = Component.other(viewer);
    const nm = (c) => c === 'w' ? 'White' : 'Black';
    vals.oppDot = opp; vals.oppName = g.tut ? 'Practice dummy (never moves)' : online ? oppNm + ' (' + nm(opp) + ')' : g.mode === 'bot' ? 'Bot (' + nm(opp) + ')' : nm(opp);
    vals.oppCards = g.hands[opp].length; vals.oppDeck = g.decks[opp].length; vals.oppDisc = g.discards[opp].length;
    vals.oppBacks = g.hands[opp].map(function () { return { style: backStyle }; });
    vals.handTitle = g.mode === 'bot' || g.tut || online ? 'Your hand' : nm(viewer) + "'s hand";
    vals.handSub = g.tut ? 'A lesson hand. In a real match you hold ' + Component.HAND_MAX + ' cards and refill after each play.' : 'Draw pile: ' + g.decks[viewer].length + '. Discard: ' + g.discards[viewer].length + '. Refills to ' + Component.HAND_MAX + ' after you play a card.';
    vals.hand = g.hands[viewer].map((type, idx) => {
      const v = this.cardView(type), sel = g.selCard === idx;
      const dim = humanTurn && !busy && !Component.targetsFor(g.board, g.turn, type, g).length;
      const coach = !!(tutStep && tutStep.card === type);
      return Object.assign({}, v, { cls: v.cls + (sel ? ' sel' : '') + (dim && !coach ? ' dim' : '') + (coach ? ' coachc' : ''), selected: sel, disabled: !humanTurn || busy, label: NM[type] + ' card', click: () => this.clickCard(idx), draggable: humanTurn && !busy, dragStart: (e) => this.dragStart(e, idx), dragEnd: () => this.dragEnd() });
    });
    vals.handEmpty = g.hands[viewer].length === 0;
    vals.handCls = ''; vals.handStyle = '';
    if (g.mode === 'local' && !g.over) {
      const bgc = g.turn === 'w' ? pl.wf : pl.bf, edge = g.turn === 'w' ? pl.we : pl.be;
      const hx = bgc.replace('#', ''), ch = (i) => parseInt(hx.substr(i, 2), 16) / 255;
      const lum = 0.2126 * ch(0) + 0.7152 * ch(2) + 0.0722 * ch(4);
      vals.handCls = 'tinted';
      vals.handStyle = 'background:' + bgc + ';border-color:' + edge + ';color:' + (lum > 0.45 ? '#14110a' : '#f4efe6');
    }
    vals.dzCls = g.selCard >= 0 && humanTurn ? 'on' : '';
    vals.noDiscard = !(humanTurn && !busy && g.selCard >= 0);
    vals.dzOver = (e) => this.dzOver(e); vals.dzDrop = (e) => this.dzDrop(e); vals.discardSel = () => this.discardSel();
    vals.capText = online ? 'You ' + g.caps[viewer] + '  |  ' + oppNm + ' ' + g.caps[opp] : (g.mode === 'bot' ? 'You ' : 'White ') + g.caps[g.mode === 'bot' ? g.human : 'w'] + '  |  ' + (g.mode === 'bot' ? 'Bot ' : 'Black ') + g.caps[g.mode === 'bot' ? opp : 'b'];

    vals.turnDot = g.turn; vals.chaining = busy && humanTurn; vals.gameCls = g.tut ? 'tut' : '';
    vals.showBan = !g.over && !busy && (!g.tut || ((g.turnNo || 0) > 0 && !g.tut.done));
    vals.banCls = 'turnban ' + ((g.turnNo || 0) % 2 ? 'banA' : 'banB');
    vals.banText = g.tut ? 'Dummy passes · your turn' : online ? (g.turn === g.human ? 'Your turn' : oppNm + '\'s turn') : g.mode === 'bot' ? (g.turn === g.human ? 'Your turn' : 'Bot\'s turn') : nm(g.turn) + '\'s turn';
    vals.turnText = g.over ? 'Game over' : g.tut ? 'Your move' : online ? (g.turn === g.human ? 'Your move' : 'Waiting for ' + oppNm) : (g.mode === 'bot' ? (g.turn === g.human ? 'Your move' : 'Bot is thinking') : nm(g.turn) + ' to move');
    vals.logLines = g.log.slice(-10).reverse().map((t) => ({ t: t }));
    let hl;
    if (g.note) hl = g.note;
    else if (g.over) hl = 'Game over.';
    /* the coach beside the board already shows the step, so this line only adds what the coach does not */
    else if (g.tut) hl = g.tut.done ? 'Lesson complete. Press Next lesson in the coach.' : g.chain ? 'Checker: pick your next capture on a red diagonal, or finish your turn.' : 'Follow the step in the coach beside the board.';
    else if (!humanTurn) hl = online ? 'Waiting for ' + oppNm + ' to move. Their move appears here as soon as they make it.' : 'The bot is choosing a move or a card.';
    else if (g.chain) hl = 'Checker: pick your next capture on a red diagonal, or finish your turn.';
    else if (g.haste) hl = 'Haste: move this piece again (no captures, not onto the far row), or Finish turn to keep Haste for later.';
    else if (g.selCard >= 0) {
      const t = g.hands[g.turn][g.selCard];
      hl = !Component.targetsFor(g.board, g.turn, t, g).length ? 'This card has no valid place right now. You can discard it to end your turn.' : t === 'pawn' ? 'Place the Pawn head on a dashed square in your first two rows.' : t === 'chk' ? 'Pick one of your pieces to give Checker.' : t === 'wb' ? 'Pick one of your Marchers to give Wall Breaker.' : t === 'zap' ? 'Pick any piece on the board to strike. It becomes a bare Pawn head.' : t === 'cavein' ? 'Pick an empty square to fill with rock. A path between both home rows always stays open.' : t === 'snare' ? 'Pick an enemy piece. It cannot move on its owner\'s next turn.' : t === 'recall' ? 'Pick a square in your first two rows. Your lost ' + PN[PO[Component.recallBody(g, g.turn)]] + ' returns there, body only.' : t === 'transpose' ? (g.tp >= 0 ? 'Now pick the piece to swap with.' : 'Pick the first of two of your pieces to swap. Marchers and Lancers never move forward.') : t === 'nuke' ? 'Pick one of your moving pieces to give Nuclear. One use.' : Component.ATTRS.indexOf(t) >= 0 ? 'Pick one of your pieces to give ' + NM[t] + '. A piece holds up to ' + Component.ATTR_MAX + ' attributes.' : 'Pick one of your pawns that has no body yet. It will turn into a ' + PN[PO[t]] + ' (' + NM[t] + ').';
    }
    else if (g.selected >= 0) hl = 'Pick a highlighted square. Capturing with a Checker piece lets you choose one more capture.';
    else hl = 'Move a piece, drag or click a card onto the board, or discard a card to end your turn.';
    vals.hintLine = hl;

    vals.isTut = !!g.tut; vals.notTut = !g.tut;
    if (g.tut) {
      const T = Component.TUTORIAL, L = T[g.tut.k], last = g.tut.k === T.length - 1;
      vals.tutNo = g.tut.k + 1; vals.tutCount = T.length; vals.tutTitle = L.title; vals.tutText = L.text;
      vals.tutWorking = !g.tut.done; vals.tutDoneNow = g.tut.done && !last;
      vals.tutStepNo = Math.min(g.tut.step + 1, L.steps.length); vals.tutSteps = L.steps.length; vals.tutTurn = (g.turnNo || 0) + 1;
      vals.tutHint = tutStep ? tutStep.hint : ''; vals.tutDoneText = L.done;
      vals.tutDots = T.map(function (_, k) { return { cls: k < g.tut.k ? 'done' : k === g.tut.k ? 'on' : '' }; });
      vals.tutNext = () => { this.sfx('click'); this.startTutorial(g.tut.k + 1); };
      vals.tutRestart = () => { this.sfx('click'); this.startTutorial(g.tut.k); };
      vals.tutSkipLabel = last ? 'Exit tutorial' : 'Skip lesson';
      vals.tutSkip = () => { this.sfx('click'); if (last) this.setState({ screen: 'home', game: null }); else this.startTutorial(g.tut.k + 1); };
      vals.tutExit = () => { this.sfx('click'); this.setState({ screen: 'home', game: null }); };
    }

    const o = g.over; vals.hasOver = !!o;
    if (o) {
      const youWin = g.mode === 'bot' || online ? o.winner === g.human : false;
      vals.againLabel = g.tut ? 'Play vs Bot' : online ? 'Back to Online' : 'Play again';
      vals.overTitle = g.tut ? 'Tutorial complete' : !o.winner ? 'Draw' : online ? (youWin ? 'You win' : oppNm + ' wins') : g.mode === 'bot' ? (youWin ? 'You win' : 'Bot wins') : nm(o.winner) + ' wins';
      vals.overSub = g.tut ? 'You know the basics: heads and bodies, moving, capturing, attributes, discarding and winning. Next, take on the bot.' : o.reason === 'breakthrough' ? 'A Marcher reached the far end of the board.' : o.reason === 'elimination' ? 'All of the opponent\'s pieces were eliminated.' : o.reason === 'stuck' ? 'Neither side can act. Most captures wins.' : 'By resignation.';
      vals.hasReward = (o.reward || 0) > 0; vals.rewardAmt = o.reward || 0; vals.rewardWhy = o.why || '';
      vals.overCls = g.tut ? 'win' : !o.winner ? 'draw' : ((g.mode === 'bot' || online) && !youWin) ? 'lose' : 'win';
    }
    return vals;
  }
}

DCRuntime.mount(Component, document.getElementById('app'), document.getElementById('dc-tpl'));
